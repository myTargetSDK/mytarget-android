[versions]
java = "11"
kotlin = "2.1.0"
#
android-gradle-plugin = "8.13.2"
karumi-plugin = "6.1.0"
versions-plugin = "0.39.0"
#
androidx-appcompat = "1.6.1"
androidx-cardview = "1.0.0"
androidx-constraintLayout = "2.1.1"
androidx-media3 = "1.2.1"
androidx-multidex = "2.0.1"
androidx-navigation = "2.3.5"
androidx-preference = "1.1.1"
androidx-recyclerview = "1.2.1"
com-google-android-gms-playservices-adsIdentifier = "17.1.0"
com-google-android-material = "1.3.0"
com-my-target-mytargetSdk = "5.45.2"

[libraries]
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "androidx-appcompat" }
androidx-cardview = { module = "androidx.cardview:cardview", version.ref = "androidx-cardview" }
androidx-constraintLayout = { module = "androidx.constraintlayout:constraintlayout", version.ref = "androidx-constraintLayout" }
androidx-media3-common = { module = "androidx.media3:media3-common", version.ref = "androidx-media3" }
androidx-media3-exoplayer = { module = "androidx.media3:media3-exoplayer", version.ref = "androidx-media3" }
androidx-media3-ui = { module = "androidx.media3:media3-ui", version.ref = "androidx-media3" }
androidx-multidex = { module = "androidx.multidex:multidex", version.ref = "androidx-multidex" }
androidx-navigation-fragmentKtx = { module = "androidx.navigation:navigation-fragment-ktx", version.ref = "androidx-navigation" }
androidx-navigation-uiKtx = { module = "androidx.navigation:navigation-ui-ktx", version.ref = "androidx-navigation" }
androidx-preference = { module = "androidx.preference:preference-ktx", version.ref = "androidx-preference" }
androidx-recyclerview = { module = "androidx.recyclerview:recyclerview", version.ref = "androidx-recyclerview" }
com-google-android-gms-playservices-adsIdentifier = { module = "com.google.android.gms:play-services-ads-identifier", version.ref = "com-google-android-gms-playservices-adsIdentifier" }
com-google-android-material = { module = "com.google.android.material:material", version.ref = "com-google-android-material" }
org-jetbrains-kotlin-stdlib = { module = "org.jetbrains.kotlin:kotlin-stdlib", version.ref = "kotlin" }

# Зависимости для build-logic
buildLogic-android-gradlePlugin = { module = "com.android.tools.build:gradle", version.ref = "android-gradle-plugin" }
buildLogic-kotlin-gradlePlugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }

[bundles]
androidx-navigation = ["androidx-navigation-fragmentKtx", "androidx-navigation-uiKtx"]

[plugins]
com-android-application = { id = "com.android.application", version.ref = "android-gradle-plugin" }
com-github-benManes-versions = { id = "com.github.ben-manes.versions", version.ref = "versions-plugin" }
org-jetbrains-kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }

# Собственные плагины проекта из build-logic
com-my-target-android-buildTypesPlugin = { id = "com.my.target.android.buildTypesPlugin", version = "unspecified" }
com-my-target-android-compilePlugin = { id = "com.my.target.android.compilePlugin", version = "unspecified" }
com-my-target-android-configPlugin = { id = "com.my.target.android.configPlugin", version = "unspecified" }
com-my-target-android-lintPlugin = { id = "com.my.target.android.lintPlugin", version = "unspecified" }