# Declare only libs used for tests: testImplementation / androidTestImplementation etc

[versions]
androidx-test = "1.5.0"
androidx-test-espresso = "3.5.1"
com-adevinta-android-barista = "4.3.0"
io-qameta-allure-kotlin = "2.4.0"
junit = "4.13.2"

[libraries]
androidx-test-core = { module = "androidx.test:core", version.ref = "androidx-test" }
androidx-test-espresso-contrib = { module = "androidx.test.espresso:espresso-contrib", version.ref = "androidx-test-espresso" }
androidx-test-espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "androidx-test-espresso" }
androidx-test-espresso-intents = { module = "androidx.test.espresso:espresso-intents", version.ref = "androidx-test-espresso" }
androidx-test-espresso-web = { module = "androidx.test.espresso:espresso-web", version.ref = "androidx-test-espresso" }
androidx-test-rules = { module = "androidx.test:rules", version.ref = "androidx-test" }
com-adevinta-android-barista = { module = "com.adevinta.android:barista", version.ref = "com-adevinta-android-barista" }
io-qameta-allure-kotlin-model = { module = "io.qameta.allure:allure-kotlin-model", version.ref = "io-qameta-allure-kotlin" }
io-qameta-allure-kotlin-commons = { module = "io.qameta.allure:allure-kotlin-commons", version.ref = "io-qameta-allure-kotlin" }
io-qameta-allure-kotlin-junit4 = { module = "io.qameta.allure:allure-kotlin-junit4", version.ref = "io-qameta-allure-kotlin" }
io-qameta-allure-kotlin-android = { module = "io.qameta.allure:allure-kotlin-android", version.ref = "io-qameta-allure-kotlin" }
junit = { module = "junit:junit", version.ref = "junit" }

[bundles]
io-qameta-allure-kotlin = ["io-qameta-allure-kotlin-model", "io-qameta-allure-kotlin-commons", "io-qameta-allure-kotlin-junit4", "io-qameta-allure-kotlin-android"]